[package]
name = "doodle"
version = "0.2.0"
description = "A recursively zoomable creative document"
authors = ["x0bd"]
edition = "2021"

[lib]
name = "doodle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.3"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
tauri-plugin-opener = "2.5.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
tiny_http = "0.12"
trash = "5.2.9"

# the Mac's own spelling (M2.8): NSSpellChecker, for Doodle to draw with
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSRange"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSpellChecker"] }
